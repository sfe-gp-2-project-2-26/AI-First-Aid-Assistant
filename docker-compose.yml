services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend/ai
    env_file:
      - ./backend/ai/.env
    environment:
      # inside compose, reach Qdrant by service name
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend/ai/assets:/app/assets
    ports:
      - "3000:3000"
    depends_on:
      - qdrant
    restart: unless-stopped

  auth-backend:
    build: ./backend/auth
    environment:
      MONGODB_URI: mongodb://mongodb:27017/firstaid
      PYTHON_BACKEND_URL: http://backend:3000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_super_secret_jwt_key_here}
      FRONTEND_URL: http://localhost:8080
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
      - backend
    restart: unless-stopped

  map:
    build: ./backend/map
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:3000
      AUTH_BACKEND_URL: http://auth-backend:4000
      MAP_BACKEND_URL: http://map:5000
      VITE_AMBULANCE_NUMBER: ${VITE_AMBULANCE_NUMBER:-123}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - auth-backend
      - map
    restart: unless-stopped

volumes:
  qdrant_data:
  mongo_data:
